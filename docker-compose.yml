services:
  db:
    image: postgres:16-alpine
    container_name: dhanwantari-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dhanwantari
      POSTGRES_PASSWORD: change_me_db_password
      POSTGRES_DB: dhanwantari
    ports:
      - "5432:5432"
    volumes:
      - dhanwantari_pgdata:/var/lib/postgresql/data

volumes:
  dhanwantari_pgdata:
